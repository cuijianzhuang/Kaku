name: release
# Every push to main is released (patch bump from the latest tag; put
# "[skip release]" in the commit message to skip). Also from the Actions tab
# ("Run workflow", choosing patch / minor / major), or by pushing a v* tag.
# Publishes binaries for every system to the GitHub Release and a
# multi-arch image to ghcr.io/cuijianzhuang/kaku.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 版本号递增方式
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME}"
          else
            if [ "${GITHUB_EVENT_NAME}" = push ] && printf '%s' "$MSG" | grep -qiF '[skip release]'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "skipped by commit message"; exit 0
            fi
            if git tag --points-at HEAD | grep -q '^v'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "HEAD is already released"; exit 0
            fi
            last=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | head -n1 || true)
            last=${last:-v0.0.0}
            IFS=. read -r ma mi pa <<< "${last#v}"
            case "$BUMP" in
              major) ma=$((ma + 1)); mi=0; pa=0 ;;
              minor) mi=$((mi + 1)); pa=0 ;;
              *) pa=$((pa + 1)) ;;
            esac
            v="v${ma}.${mi}.${pa}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

  test:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Pure Go (no cgo): every target cross-compiles from one runner.
          for target in \
            linux/amd64 linux/arm64 linux/arm/7 linux/386 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64 \
            freebsd/amd64 freebsd/arm64; do
            IFS=/ read -r os arch arm <<< "$target"
            name="kaku-$os-$arch"
            [ -n "${arm:-}" ] && name="${name}v$arm"
            ext=""; [ "$os" = windows ] && ext=".exe"
            echo "building $name$ext"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=${arm:-} \
              go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" -o "dist/$name$ext" ./cmd/kaku
          done
          cp scripts/install.sh compose.yaml deploy/Caddyfile deploy/kaku.env.example dist/
          cd dist && sha256sum -- * > checksums.txt && cat checksums.txt
      - name: Smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./dist/kaku-linux-amd64 version | tee /dev/stderr | grep -qx "kaku ${VERSION}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            **一键安装（Linux + systemd）**
            ```bash
            bash <(curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh) install --domain shop.example.com
            ```

            **Docker**：`ghcr.io/cuijianzhuang/kaku:latest`（或具体版本号，不带 v），支持 amd64 / arm64

            **二进制**（SHA-256 见 `checksums.txt`）

            | 系统 | 文件 |
            | --- | --- |
            | Linux | `kaku-linux-amd64` / `kaku-linux-arm64` / `kaku-linux-armv7` / `kaku-linux-386` |
            | macOS | `kaku-darwin-arm64`（Apple 芯片）/ `kaku-darwin-amd64`（Intel） |
            | Windows | `kaku-windows-amd64.exe` / `kaku-windows-arm64.exe` |
            | FreeBSD | `kaku-freebsd-amd64` / `kaku-freebsd-arm64` |

            部署说明见 README。

  image:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Image names must be lowercase (the repository is "Kaku").
          images: ghcr.io/cuijianzhuang/kaku
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
