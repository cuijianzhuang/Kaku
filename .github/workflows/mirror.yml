name: mirror
on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  public:
  release:
    types: [published, edited, deleted, unpublished, prereleased, released]
  # Releases created by GITHUB_TOKEN do not trigger another release workflow.
  # Reconcile after the producer completes, including partial build failures.
  workflow_run:
    workflows: [release, cf-ip-probe, ci]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      history:
        description: 首次只导入最新正式版和预发布；all 也会导入全部历史附件
        type: choice
        options: [latest, all]
        default: latest
permissions:
  contents: read
concurrency:
  group: organization-mirror
  cancel-in-progress: false
jobs:
  sync:
    # Mirrored workflows must never copy organization changes back to personal repos.
    if: github.repository_owner == 'cuijianzhuang'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_REPOSITORY: ${{ github.repository }}
      TARGET_REPOSITORY: PolarisPanelOrg/${{ github.event.repository.name }}
      SOURCE_TOKEN: ${{ github.token }}
      TARGET_TOKEN: ${{ secrets.MIRROR_TOKEN }}
      HISTORY: ${{ inputs.history || 'latest' }}
      EVENT_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Require the destination-scoped mirror credential
        run: |
          if [ -z "$TARGET_TOKEN" ]; then
            echo '::error::Configure MIRROR_TOKEN for the corresponding organization mirror repository (Contents, Workflows and Administration: write).'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Always run trusted default-branch code, especially on workflow_run.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Mirror visibility, branches, tags and release assets
        run: |
          python3 .github/scripts/mirror-sync.py \
            --source "$SOURCE_REPOSITORY" --target "$TARGET_REPOSITORY" \
            --history "$HISTORY" --event-tag "$EVENT_TAG"
