{{define "title"}}售后工单 · {{.Site}}{{end}}
{{define "content"}}
<div class="narrow">
  <div class="card">
    <h1>售后工单</h1>
    <p class="muted">描述你遇到的问题，我们会通过邮件回复。</p>
    <form method="post" action="/ticket" class="stack" style="margin-top:8px">
      <div class="two">
        <label>订单号（可选）<input name="order_no" value="{{.OrderNo}}" maxlength="40"></label>
        <label>查询密码（填写订单号时必填）<input type="password" name="password" maxlength="64"></label>
      </div>
      <label>联系邮箱<input type="email" name="email" required maxlength="200" value="{{.Email}}" autocomplete="email"></label>
      <label>问题描述<textarea name="content" required maxlength="2000" style="font-family:inherit;font-size:14px">{{.Content}}</textarea></label>
      <button class="lg block">提交</button>
    </form>
  </div>
</div>
{{end}}
