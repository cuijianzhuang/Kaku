{{define "title"}}售后工单 · {{.Site}}{{end}}
{{define "content"}}
<div class="card">
  <h1>提交售后工单</h1>
  <form method="post" action="/ticket" class="stack">
    <label>订单号（可选） <input name="order_no" value="{{.OrderNo}}" maxlength="40"></label>
    <label>查询密码（填写订单号时必填） <input type="password" name="password" maxlength="64"></label>
    <label>联系邮箱 <input type="email" name="email" required maxlength="200"></label>
    <label>问题描述 <textarea name="content" required maxlength="2000" style="font-family:inherit"></textarea></label>
    <button>提交</button>
  </form>
</div>
{{end}}
