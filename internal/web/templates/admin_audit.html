{{define "title"}}审计日志{{end}}
{{define "content"}}
<h1>审计日志</h1>
<div class="card table-wrap"><table>
  <tr><th>时间</th><th>管理员</th><th>操作</th><th>对象</th><th>详情</th><th>IP</th></tr>
  {{range .Logs}}<tr><td>{{date .CreatedAt}}</td><td>{{.Admin}}</td><td><a href="?action={{.Action}}">{{.Action}}</a></td><td>{{.Target}}</td><td class="muted">{{.Detail}}</td><td>{{.IP}}</td></tr>
  {{else}}<tr><td colspan="6" class="muted">暂无</td></tr>{{end}}
</table>
<div class="pager">
  {{if gt .Page 1}}<a href="?page={{add .Page -1}}">上一页</a>{{end}}
  <span>第 {{.Page}} 页</span>
  {{if .HasNext}}<a href="?page={{add .Page 1}}">下一页</a>{{end}}
</div>
</div>
{{end}}
